name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  CHEZMOI_VERSION: 2.73.3
  PRE_COMMIT_VERSION: 4.7.0
  SHELLCHECK_PY_VERSION: 0.11.0.1

jobs:
  pre-commit:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"

      - name: Install verified chezmoi
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)
              asset="chezmoi_${CHEZMOI_VERSION}_linux_amd64.tar.gz"
              checksum="6e5827598cbfc02d132b04f95b5ea10efb5b79230e2a4a0e52df4af144a8ee9f"
              ;;
            Darwin-x86_64)
              asset="chezmoi_${CHEZMOI_VERSION}_darwin_amd64.tar.gz"
              checksum="d865487d6669243c948ee5542087bd95f4ad4ecb5a1311b85cf19f557694fe03"
              ;;
            Darwin-arm64)
              asset="chezmoi_${CHEZMOI_VERSION}_darwin_arm64.tar.gz"
              checksum="ec2d0005f369c912ee9891a26c30d65dc0eda51708f06948e5f7a43db69e1aa7"
              ;;
            *)
              echo "Unsupported runner architecture: $(uname -s)-$(uname -m)" >&2
              exit 1
              ;;
          esac
          archive="${RUNNER_TEMP}/${asset}"
          python - "${asset}" "${archive}" <<'PY'
          import os
          import sys
          import urllib.request

          asset, destination = sys.argv[1:]
          version = os.environ["CHEZMOI_VERSION"]
          url = f"https://github.com/twpayne/chezmoi/releases/download/v{version}/{asset}"
          urllib.request.urlretrieve(url, destination)
          PY
          printf '%s  %s\n' "${checksum}" "${archive}" | shasum -a 256 --check
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/bin" chezmoi
          echo "${RUNNER_TEMP}/bin" >>"${GITHUB_PATH}"

      - name: Install pinned validation tools
        run: >-
          python -m pip install
          "pre-commit==${PRE_COMMIT_VERSION}"
          "shellcheck-py==${SHELLCHECK_PY_VERSION}"

      - name: Create fixture age identity and encrypted secrets
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            key_dir="${HOME}/Library/Application Support/sops/age"
          else
            key_dir="${HOME}/.config/sops/age"
          fi
          key_file="${key_dir}/keys.txt"
          generated_key="${RUNNER_TEMP}/fixture-age-key.txt"
          chezmoi age-keygen -o "${generated_key}"
          age_key="$(awk '/^AGE-SECRET-KEY-/{print; exit}' "${generated_key}")"
          printf '%s\n' "${age_key}" | ./configure
          unset age_key
          python - "${key_file}" <<'PY'
          import os
          import stat
          import sys

          mode = stat.S_IMODE(os.stat(sys.argv[1]).st_mode)
          if mode != 0o600:
              raise SystemExit(f"age identity has mode {mode:o}, expected 600")
          PY
          recipient="$(chezmoi age-keygen -y "${key_file}")"
          chezmoi --age-recipient "${recipient}" encrypt \
            --output encrypted_secrets.yaml.age \
            tests/fixtures/fixture-secrets.yaml

      - name: Verify rendered shellenv
        shell: bash
        run: |
          set -euo pipefail
          rendered_shellenv="${RUNNER_TEMP}/shellenv"
          chezmoi execute-template --source . <private_dot_shellenv.tmpl >"${rendered_shellenv}"
          shellcheck --shell=sh "${rendered_shellenv}"
          sh tests/verify_shellenv.sh sh "${rendered_shellenv}"

      - name: Verify rendered shellenv in zsh and bash
        shell: bash
        run: |
          set -euo pipefail
          rendered_shellenv="${RUNNER_TEMP}/shellenv"
          chezmoi execute-template --source . <private_dot_shellenv.tmpl >"${rendered_shellenv}"
          case "$(uname -s)" in
            Darwin) interpreters="zsh bash" ;;
            *) interpreters="bash" ;;
          esac
          for interpreter in ${interpreters}; do
            command -v "${interpreter}" >/dev/null 2>&1 || {
              echo "verify-shellenv: ${interpreter} is required on this runner" >&2
              exit 1
            }
            sh tests/verify_shellenv.sh "${interpreter}" "${rendered_shellenv}"
          done

      - name: Verify rendered AWS profiles
        shell: bash
        run: |
          set -euo pipefail
          for kind in config credentials; do
            chezmoi execute-template --source . <"dot_aws/private_${kind}.tmpl" \
              | python3 tests/verify_aws_profiles.py "${kind}"
          done

      - name: Run pre-commit
        run: pre-commit run --all-files
