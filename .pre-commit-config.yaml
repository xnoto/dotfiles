repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: detect-private-key

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^(configure|dot_bashrc\.d/|dot_local/bin/)
        exclude: \.tmpl$
        types: [file]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.17.0
    hooks:
      - id: commitizen

  - repo: local
    hooks:
      - id: chezmoi-templates
        name: Validate chezmoi templates
        entry: "bash -c 'for f in \"$@\"; do chezmoi execute-template --source . < \"$f\" > /dev/null || { echo \"Template error in $f\"; exit 1; }; done' --"
        language: system
        files: (\.tmpl$|\.chezmoiignore$|\.chezmoiremove$)
        pass_filenames: true

      - id: chezmoi-doctor
        name: Run chezmoi doctor
        entry: "bash -c 'TMPDIR=\"$PWD\" chezmoi doctor --no-network --source=\"$PWD\"'"
        language: system
        pass_filenames: false
        always_run: true
        verbose: true

      - id: chezmoi-dry-run
        name: chezmoi apply dry-run
        entry: chezmoi apply --dry-run --force --source .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: chezmoi-secrets-decrypt
        name: Validate secrets decryption and YAML
        entry: bash -c 'chezmoi execute-template --source . "{{ fromYaml (include \"encrypted_secrets.yaml.age\" | decrypt) | len }}" > /dev/null'
        language: system
        pass_filenames: false
        always_run: true

      - id: secret-template-permissions
        name: Require private mode for secret templates
        entry: python3 tests/check_secret_templates_private.py
        language: system
        pass_filenames: false
        always_run: true
